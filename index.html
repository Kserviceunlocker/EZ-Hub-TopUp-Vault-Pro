let db;const idb=()=>db?Promise.resolve(db):new Promise((ok,no)=>{const r=indexedDB.open('ezhub',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('r'))d.createObjectStore('r',{keyPath:'id'});if(!d.objectStoreNames.contains('rc'))d.createObjectStore('rc',{keyPath:'no'})};r.onsuccess=()=>ok(db=r.result);r.onerror=()=>no(r.error)});
const tx=async(st,m,f)=>{const d=await idb();return new Promise((ok,no)=>{const q=f(d.transaction(st,m).objectStore(st));q.onsuccess=()=>ok(q.result);q.onerror=e=>{e.preventDefault&&e.preventDefault();no(q.error)}})};
const dbAll=()=>tx('r','readonly',s=>s.getAll()),dbPut=r=>tx('r','readwrite',s=>s.put(r)),dbDel=id=>tx('r','readwrite',s=>s.delete(id));
const rcAll=()=>tx('rc','readonly',s=>s.getAll()),rcAdd=r=>tx('rc','readwrite',s=>s.add(r)),rcGet=n=>tx('rc','readonly',s=>s.get(n));
/* ---------- Google Drive ---------- */
function auth(){return new Promise((ok,no)=>{
 if(tok&&Date.now()<tokExp)return ok(tok);
 if(!cfg.cid){toast(t('nocid'));$('mSet').classList.add('on');return no('cid')}
 if(!window.google||!google.accounts)return no('gsi');
 google.accounts.oauth2.initTokenClient({client_id:cfg.cid,scope:'https://www.googleapis.com/auth/drive.file',
  callback:r=>{if(r.error)return no(r.error);tok=r.access_token;tokExp=Date.now()+(r.expires_in-60)*1000;applyLang();ok(tok)}}).requestAccessToken({prompt:''})})}
async function dr(path,o={}){const a=await auth();const r=await fetch('https://www.googleapis.com'+path,{...o,headers:{Authorization:'Bearer '+a,...(o.headers||{})}});if(!r.ok)throw new Error('Drive '+r.status);return r}
const fcache={};
async function getFolder(name='EZ-Hub TopUp Vault'){if(fcache[name])return fcache[name];
 const q=encodeURIComponent(`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
 const j=await(await dr('/drive/v3/files?q='+q+'&fields=files(id)')).json();
 if(j.files[0])return fcache[name]=j.files[0].id;
 const c=await(await dr('/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder'})})).json();
 return fcache[name]=c.id}
async function upload(name,data,mime='text/plain',fold){const p=await getFolder(fold),b='ezb'+Date.now();
 const body=new Blob([`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name,parents:[p]})}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`,data,`\r\n--${b}--`]);
 const r=await dr('/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
 return(await r.json()).id}
async function purge(){let n=0;const lim=Date.now()-TTL;
 for(const r of await dbAll())if(r.created<lim){await dbDel(r.id);n++}
 if(tok){try{const p=await getFolder(),q=encodeURIComponent(`'${p}' in parents and createdTime < '${new Date(lim).toISOString()}' and trashed=false`);
  const j=await(await dr('/drive/v3/files?q='+q+'&fields=files(id)&pageSize=100')).json();
  for(const f of j.files){await dr('/drive/v3/files/'+f.id,{method:'DELETE'});n++}}catch(e){}}
 if(n)toast(t('purged')+n)}
async function push(r){if(r.blob&&!r.pid)r.pid=await upload('ev_'+r.id+'_'+(r.name||'photo.jpg').replace(/[^\w.-]/g,'_'),r.blob,r.mime||'image/jpeg');
 const{blob,...m}=r;r.fid=await upload('rec_'+r.id+'.json',JSON.stringify(m),'application/json');r.status='synced';await dbPut(r)}
async function pushRc(r){const{fid,...m}=r;r.fid=await upload('rc_'+r.no.slice(1)+'.json',JSON.stringify(m),'application/json','EZ-Hub Receipts');await tx('rc','readwrite',s=>s.put(r))}
async function sync(){try{await auth();const p=await getFolder(),rf=await getFolder('EZ-Hub Receipts');
 const ls=async(f,pre)=>(await(await dr('/drive/v3/files?q='+encodeURIComponent(`'${f}' in parents and name contains '${pre}' and trashed=false`)+'&fields=files(id)&pageSize=200')).json()).files;
 const have=new Set((await dbAll()).map(r=>r.fid));
 for(const f of await ls(p,'rec_'))if(!have.has(f.id)){const r=await(await dr('/drive/v3/files/'+f.id+'?alt=media')).json();r.fid=f.id;if(r.pid&&!r.img)r.blob=await(await dr('/drive/v3/files/'+r.pid+'?alt=media')).blob();await dbPut(r)}
 for(const r of await dbAll())if(!r.fid)await push(r);
 const hr=new Set((await rcAll()).map(r=>r.no));
 for(const f of await ls(rf,'rc_')){const r=await(await dr('/drive/v3/files/'+f.id+'?alt=media')).json();if(!hr.has(r.no)){r.fid=f.id;await rcAdd(r)}}
 for(const r of await rcAll())if(!r.fid)await pushRc(r);
 await purge();await load();await loadRc();toast(t('synced'))}catch(e){toast(String(e.message||e))}}
/* ---------- image + AI ---------- */
function shrink(file,max=1100,q=.7){return new Promise(ok=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.src=URL.createObjectURL(file)})}
let orig=null,scanImg=null,dim=[0,0];
async function picked(f){if(!f)return;orig=f;scanImg=await shrink(f,1400,.8);const u=URL.createObjectURL(f);$('prev').src=u;$('prev').style.display='block';$('bScan').style.display='block';
 const im=new Image();im.onload=()=>dim=[im.naturalWidth,im.naturalHeight];im.src=u;scan()}
async function scan(){if(!scanImg)return toast(t('need'));if(!cfg.gem){toast(t('nokey'));return $('mSet').classList.add('on')}
 $('scanSt').textContent=t('scanning');
 try{const prompt='This is a mobile top-up / money transfer receipt or screenshot. Extract JSON only: {"phone": digits of the recipient number or account, "operator": telecom operator or payment service name, "amount": number only, "datetime": "YYYY-MM-DDTHH:MM" 24h or empty string}. For transfer detail screens, phone = the Destination / recipient number (not the Source), amount = the transaction amount shown (positive number), datetime = Transaction Date. Use empty string if unknown.';
  let j,r,err;for(const m of ['gemini-3.8-flash','gemini-flash-latest']){
   r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+cfg.gem,{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:scanImg.split(',')[1]}}]}],generationConfig:{responseMimeType:'application/json'}})});
   j=await r.json();if(r.ok)break;err=j.error?.message||r.status}
  if(!r.ok)throw new Error(err);
  const d=JSON.parse(j.candidates[0].content.parts[0].text.replace(/```json|```/g,''));
  if(d.phone)$('phone').value=d.phone;if(d.operator)$('op').value=d.operator;if(d.amount)$('amt').value=d.amount;
  if(d.datetime)$('dt').value=String(d.datetime).slice(0,16);$('scanSt').textContent=t('scanned')}
 catch(e){$('scanSt').textContent=t('scanErr')+e.message}}
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
async function save(){if(!orig)return toast(t('need'));
 const now=Date.now(),r={id:now+'',created:now,expires:now+TTL,blob:orig,name:orig.name||'photo.jpg',mime:orig.type||'image/jpeg',size:orig.size,w:dim[0],h:dim[1],phone:$('phone').value.trim(),op:$('op').value.trim(),amt:$('amt').value,dt:$('dt').value||nowLocal(),note:$('note').value.trim(),status:'local'};
 $('bSave').disabled=true;await dbPut(r);
 if(tok){$('scanSt').textContent=t('upl');try{await push(r)}catch(e){r.status='failed';await dbPut(r);toast(t('upErr')+e.message)}}
 orig=scanImg=null;['phone','op','amt','note'].forEach(i=>$(i).value='');$('dt').value=nowLocal();$('prev').style.display='none';$('bScan').style.display='none';$('scanSt').textContent='';
 $('bSave').disabled=false;toast(t('saved'));load()}
/* ---------- vault list ---------- */
const uc={};const imgSrc=r=>r.img||(uc[r.id]=uc[r.id]||(r.blob?URL.createObjectURL(r.blob):''));
async function load(){recs=(await dbAll()).sort((a,b)=>b.created-a.created);render()}
function render(){const q=$('q').value.trim(),rows=recs.filter(r=>!q||(r.phone+r.op).includes(q));
 $('list').innerHTML=rows.length?rows.map(r=>`<div class="it"><input type="checkbox" data-id="${r.id}" ${sel.has(r.id)?'checked':''}><img src="${imgSrc(r)}" data-v="${r.id}"><div class="i"><b>${esc(r.phone)}</b> ${r.pid||r.fid?"☁️":"📱"} · ${esc(r.op)}<br>💰 ${esc(r.amt)} <span class="mu">${esc((r.dt||'').replace('T',' '))}</span><br><span class="mu">${Math.max(0,Math.ceil((r.created+TTL-Date.now())/DAY))} ${t('left')}</span></div><button class="d" data-d="${r.id}">🗑</button></div>`).join(''):`<p class="mu">${t('none')}</p>`;
 $('cnt').textContent=sel.size;
 const d0=new Date().setHours(0,0,0,0);$('stats').textContent=`${t('vault')}: ${recs.length} • ${t('today')}: ${recs.filter(r=>r.created>=d0).length} • ${t('soon')}: ${recs.filter(r=>r.created+TTL-Date.now()<7*DAY).length}`}
$('list').onclick=async e=>{const c=e.target;
 if(c.dataset.id){c.checked?sel.add(c.dataset.id):sel.delete(c.dataset.id);$('cnt').textContent=sel.size}
 else if(c.dataset.v){const r=recs.find(x=>x.id===c.dataset.v);$('mImgB').innerHTML=`<img class="big" src="${imgSrc(r)}"><div class="mu" style="margin-bottom:8px">${esc(r.name||'')} ${r.w?r.w+'×'+r.h:''} ${r.size?(r.size/1048576).toFixed(2)+' MB':''}<br>${new Date(r.created).toLocaleString()} → ${new Date(r.created+TTL).toLocaleDateString()}</div><div class="row"><a href="${imgSrc(r)}" download="${esc(r.name||'evidence.jpg')}"><button class="p" style="width:100%">${t('dl')}</button></a><button onclick="mImg.classList.remove('on')">${t('close')}</button></div>`;$('mImg').classList.add('on')}
 else if(c.dataset.d&&confirm(t('conf'))){const r=recs.find(x=>x.id===c.dataset.d);await dbDel(r.id);if(tok)for(const x of [r.fid,r.pid])if(x)try{await dr('/drive/v3/files/'+x,{method:'DELETE'})}catch(e){}sel.delete(r.id);load()}};
/* ---------- AES-GCM E2EE share ---------- */
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function share(){if(!sel.size)return toast(t('sel'));
 const data=await Promise.all(recs.filter(r=>sel.has(r.id)).map(async r=>({img:r.img||await shrink(r.blob),phone:r.phone,op:r.op,amt:r.amt,dt:r.dt,note:r.note})));
 const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data)));
 const raw=await crypto.subtle.exportKey('raw',key),blob=b64(iv)+'.'+b64(ct),base=location.href.split('#')[0];let link;
 if(tok){try{const id=await upload('sh_'+Date.now()+'.txt',blob);
   await dr('/drive/v3/files/'+id+'/permissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'reader',type:'anyone'})});
   link=`${base}#f=${id}&a=${encodeURIComponent(cfg.key||'')}&k=${b64(raw)}`}catch(e){toast(e.message)}}
 if(!link)link=`${base}#d=${blob}&k=${b64(raw)}`;
 $('lnk').value=link;$('mLink').classList.add('on')}
async function openViewer(h){$('app').style.display='none';$('viewer').style.display='block';const v=$('vBody');v.textContent=t('dec');
 try{const p=new URLSearchParams(h);let blob=p.get('d');
  if(!blob){const r=await fetch(`https://www.googleapis.com/drive/v3/files/${p.get('f')}?alt=media&key=${p.get('a')}`);if(!r.ok)throw 0;blob=await r.text()}
  const[iv,ct]=blob.trim().split('.'),key=await crypto.subtle.importKey('raw',unb64(p.get('k')),'AES-GCM',false,['decrypt']);
  const data=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},key,unb64(ct))));
  v.innerHTML=data.map(r=>`<div style="margin-bottom:14px"><img class="big" src="${esc(r.img)}"><div style="color:var(--tx)"><b>${esc(r.phone)}</b> · ${esc(r.op)}<br>💰 ${esc(r.amt)} · ${esc((r.dt||'').replace('T',' '))}<br>${esc(r.note)}</div></div>`).join('')}
 catch(e){v.textContent=t('decErr')}}
/* ---------- receipt generator ---------- */
const AL='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';let curNo='',cur=null,rcs=[];
function rnd(){let o='';const a=crypto.getRandomValues(new Uint8Array(32));for(const v of a){if(v<252)o+=AL[v%36];if(o.length===6)return o}return rnd()}
const mkNo=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return '#EZ-'+p(d.getFullYear()%100)+p(d.getMonth()+1)+p(d.getDate())+'-'+rnd()};
async function freshNo(){for(let i=0;i<8;i++){const n=mkNo();if(await rcGet(n))continue;
 if(tok)try{const f=await getFolder('EZ-Hub Receipts'),j=await(await dr('/drive/v3/files?q='+encodeURIComponent(`'${f}' in parents and name='rc_${n.slice(1)}.json' and trashed=false`)+'&fields=files(id)')).json();if(j.files.length)continue}catch(e){}
 return n}throw new Error(t('rDup'))}
async function newNo(){try{curNo=await freshNo();$('rno').textContent=curNo}catch(e){toast(e.message)}}
const calc=()=>{const v=(+$('rqt').value||0)*(+$('rpr').value||0);$('rtot').textContent=v.toFixed(2);return v};
async function saveRc(){const c=$('rcn').value.trim(),x=$('rtx').value.trim(),pr=+$('rpr').value;if(!c||!x||!(pr>0))return toast(t('rNeed'));
 let r=null;for(let i=0;i<6&&!r;i++){const k={no:curNo,created:Date.now(),cust:c,phone:$('rph').value.trim(),dev:$('rdv').value.trim(),txn:x,qty:+$('rqt').value||1,price:pr,pay:$('rpm').value,total:calc()};
  try{await rcAdd(k);r=k}catch(e){await newNo()}}
 if(!r)return toast(t('rDup'));
 if(tok)try{await pushRc(r)}catch(e){toast(t('upErr')+e.message)}
 ['rcn','rph','rdv','rtx','rpr'].forEach(i=>$(i).value='');$('rqt').value=1;calc();await newNo();await loadRc();showRc(r);toast(t('rSaved'))}
const rcHTML=r=>`<div class="paper"><div class="ph">EZ-HUB OFFICIAL E-RECEIPT</div><div class="ps">Generated by @KoKoKuu</div><div class="pn">${esc(r.no)}</div>`+[['rDate',new Date(r.created).toLocaleString()],['cust',r.cust],['phone',r.phone],['device',r.dev],['pay',r.pay]].filter(x=>x[1]).map(x=>`<div class="pl"><span>${t(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')+`<hr><div class="pl"><span>${esc(r.txn)}</span><b>${r.qty} × ${(+r.price).toFixed(2)}</b></div><div class="pt"><span>${t('total')}</span><span>${(+r.total).toFixed(2)}</span></div><div class="pf">Thank you • EZ-Hub</div></div>`;
function showRc(r){cur=r;$('rcpt').innerHTML=rcHTML(r);$('mRc').classList.add('on')}
async function loadRc(){rcs=(await rcAll()).sort((a,b)=>b.created-a.created);renderRc()}
function renderRc(){const q=$('q2').value.trim().toLowerCase(),rows=rcs.filter(r=>!q||(r.no+r.cust+r.phone).toLowerCase().includes(q));
 $('rlist').innerHTML=rows.length?rows.map(r=>`<div class="it"><div class="i"><b>${esc(r.no)}</b> ${r.fid?'☁️':'📱'}<br>${esc(r.cust)} · ${(+r.total).toFixed(2)}<br><span class="mu">${new Date(r.created).toLocaleString()}</span></div><button data-r="${esc(r.no)}">${t('view')}</button></div>`).join(''):`<p class="mu">${t('none')}</p>`}
async function pdf(){try{const c=await html2canvas($('rcpt'),{scale:2,backgroundColor:'#fff'}),w=80,h=Math.max(40,c.height*w/c.width),d=new window.jspdf.jsPDF({unit:'mm',format:[w,h]});d.addImage(c.toDataURL('image/png'),'PNG',0,0,w,c.height*w/c.width);d.save(cur.no.slice(1)+'.pdf')}catch(e){toast('PDF: '+(e.message||e)+' → '+t('print'))}}
function tab(n){$('tabE').style.display=n?'none':'block';$('tabR').style.display=n?'block':'none';$('tE').classList.toggle('on',!n);$('tR').classList.toggle('on',!!n);localStorage.tab=n;if(n&&!curNo)newNo()}
$('bRnd').onclick=newNo;$('bRSave').onclick=saveRc;$('rqt').oninput=$('rpr').oninput=calc;$('q2').oninput=renderRc;
$('rlist').onclick=e=>{const n=e.target.dataset.r;if(n)showRc(rcs.find(r=>r.no===n))};
$('bPrint').onclick=()=>window.print();$('bPdf').onclick=pdf;
/* ---------- wiring ---------- */
$('lang').onchange=e=>{L=e.target.value;applyLang()};
$('bSet').onclick=()=>{$('cCid').value=cfg.cid||'';$('cKey').value=cfg.key||'';$('cGem').value=cfg.gem||'';$('mSet').classList.add('on')};
$('bCfg').onclick=()=>{cfg={cid:$('cCid').value.trim(),key:$('cKey').value.trim(),gem:$('cGem').value.trim()};localStorage.cfg=JSON.stringify(cfg);$('mSet').classList.remove('on');toast(t('cfgSaved'))};
$('bCam').onclick=()=>$('file').click();$('bUp').onclick=()=>$('file2').click();
$('file').onchange=e=>picked(e.target.files[0]);$('file2').onchange=e=>picked(e.target.files[0]);
$('bScan').onclick=scan;$('bSave').onclick=save;$('bShare').onclick=share;$('q').oninput=render;
$('bDrive').onclick=sync;$('bSync').onclick=sync;
$('bAll').onclick=()=>{const q=$('q').value.trim(),rows=recs.filter(r=>!q||(r.phone+r.op).includes(q));rows.every(r=>sel.has(r.id))?sel.clear():rows.forEach(r=>sel.add(r.id));render()};
$('bCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('lnk').value)}catch(e){$('lnk').select();document.execCommand('copy')}toast(t('copied'))};
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));
(async()=>{applyLang();$('dt').value=nowLocal();
 if(/[#&](f|d)=/.test(location.hash))return openViewer(location.hash.slice(1));
 await purge();await load();await loadRc();tab(+localStorage.tab||0);
 if('serviceWorker'in navigator&&location.protocol.startsWith('http')){/* optional: add sw.js for offline */}})();
</script></body></html>
